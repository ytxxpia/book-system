name: Sync Book from Discussions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  discussions: write

concurrency:
  group: sync-book
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const BOOK_PATH = 'book/book.txt';
            const PROCESSED_PATH = '.github/processed-discussions.json';
            const { owner, repo } = context.repo;

            // 调试日志，确认当前跑的是新代码
            core.info('=== 开始执行 GraphQL 同步逻辑 ===');

            // 1. 读取已处理记录
            let processed = [];
            if (fs.existsSync(PROCESSED_PATH)) {
              try { processed = JSON.parse(fs.readFileSync(PROCESSED_PATH, 'utf8')); } catch {}
            }
            const processedSet = new Set(processed);

            // 2. 读取书籍数据
            let lines = [];
            if (fs.existsSync(BOOK_PATH)) {
              lines = fs.readFileSync(BOOK_PATH, 'utf8').split('\n').filter(l => l.trim());
            }

            // 3. GraphQL 拉取讨论
            const listQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  discussions(first: 30, orderBy: {field: UPDATED_AT, direction: DESC}) {
                    nodes { id number body }
                  }
                }
              }
            `;
            const listRes = await github.graphql(listQuery, { owner, repo });
            const discussions = listRes.repository.discussions.nodes || [];

            let changed = false;
            const newlyProcessed = [];
            const replies = [];

            // 4. 解析与处理
            for (const d of discussions) {
              if (processedSet.has(d.number)) continue;

              const match = (d.body || '').match(/<!--\s*BOOK_ACTION:\s*(\{[\s\S]*?\})\s*-->/);
              if (!match) continue;

              let action;
              try { action = JSON.parse(match[1]); } catch { continue; }

              const { type, isbn, coord, user } = action;
              if (!type || !isbn || !coord || !user) continue;

              // 找书
              let idx = lines.findIndex(l => {
                const f = l.split(',');
                return f[1] && f[1].trim() === isbn;
              });

              // 首次入库
              if (idx === -1) {
                const parts = coord.split(',').map(Number);
                const lat = isNaN(parts[0]) ? 0 : parts[0];
                const lng = isNaN(parts[1]) ? 0 : parts[1];
                const jitter = () => (Math.random() - 0.5) * 0.01;
                const randCoord = `${(lat + jitter()).toFixed(6)},${(lng + jitter()).toFixed(6)}`;
                const title  = action.title  || '《BBBB》';
                const author = action.author || 'WWWW';

                lines.push(`${title},${isbn},${author},00-00-00,${randCoord},PPPP`);
                idx = lines.length - 1;
                replies.push({ id: d.id, body: `📚 ISBN ${isbn} 首次入库。` });
              }

              const fields = lines[idx].split(',');
              while (fields.length < 6) fields.push('PPPP');
              const currentBorrower = (fields[5] || 'PPPP').trim();

              if (type === 'borrow') {
                if (currentBorrower !== 'PPPP') {
                  replies.push({ id: d.id, body: `❌ 《${fields[0]}》已被 ${currentBorrower} 借走。` });
                  continue;
                }
                fields[4] = coord;
                fields[5] = user;
                lines[idx] = fields.join(',');
                changed = true;
                replies.push({ id: d.id, body: `✅ 借阅成功：《${fields[0]}》，借阅人 ${user}。` });
              } else if (type === 'return') {
                if (currentBorrower === 'PPPP') {
                  replies.push({ id: d.id, body: `❌ 《${fields[0]}》未被借出，无需归还。` });
                  continue;
                }
                if (currentBorrower !== user) {
                  replies.push({ id: d.id, body: `❌ 《${fields[0]}》由 ${currentBorrower} 借出，你无法归还。` });
                  continue;
                }
                fields[4] = coord;
                fields[5] = 'PPPP';
                lines[idx] = fields.join(',');
                changed = true;
                replies.push({ id: d.id, body: `✅ 归还成功：《${fields[0]}》。` });
              }

              newlyProcessed.push(d.number);
            }

            // 5. 写回文件
            if (changed) {
              fs.mkdirSync('book', { recursive: true });
              fs.writeFileSync(BOOK_PATH, lines.join('\n') + '\n');
            }
            if (newlyProcessed.length) {
              const all = [...processed, ...newlyProcessed].slice(-500);
              fs.mkdirSync('.github', { recursive: true });
              fs.writeFileSync(PROCESSED_PATH, JSON.stringify(all, null, 2));
            }

            // 6. 回复讨论 (GraphQL)
            const commentMutation = `
              mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                  comment { id }
                }
              }
            `;
            for (const r of replies) {
              try {
                await github.graphql(commentMutation, { discussionId: r.id, body: r.body });
              } catch (e) {
                core.warning(`回复失败: ${e.message}`);
              }
            }
            core.info('=== 执行完毕 ===');

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add book/book.txt .github/processed-discussions.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "sync: update book.txt from discussions" && git push)
